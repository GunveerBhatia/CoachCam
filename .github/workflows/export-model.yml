# One-off job: converts YOLO11n to Core ML and publishes it as the "model-yolo11n"
# release. The .mlpackage is then committed into CoachCam/Resources/Models/,
# so normal app builds never re-run this.
name: Export YOLO model

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/export_yolo.py"
      - ".github/workflows/export-model.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pinned: the newest torch/numpy break coremltools' PyTorch converter
      # ("only 0-dimensional arrays can be converted to Python scalars").
      - name: Install exporter
        run: |
          pip install "torch==2.5.1" "torchvision==0.20.1" "numpy==1.26.4" "coremltools==8.3.0"
          pip install "ultralytics>=8.3,<8.4"
          pip install "numpy==1.26.4"
          python -c "import torch, numpy, coremltools; print(torch.__version__, numpy.__version__, coremltools.__version__)"

      - name: Export YOLO11n → Core ML
        run: python scripts/export_yolo.py

      - name: Zip model
        run: |
          ls -la
          zip -qry yolo11n.mlpackage.zip yolo11n.mlpackage

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete model-yolo11n --cleanup-tag --yes || true
          gh release create model-yolo11n yolo11n.mlpackage.zip \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "YOLO11n Core ML model" \
            --notes "Exported by scripts/export_yolo.py. Not an app build."
