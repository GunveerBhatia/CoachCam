# Converts the on-device models to Core ML on a macOS runner and publishes each as a
# release ("model-yoloe", "model-person-type") so they can be inspected or committed.
# Normal app builds don't need this: build.yml builds the YOLOE detector itself (cached),
# and PersonTypeModel.mlpackage is committed to the repo.
name: Export models

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/export_yoloe.py"
      - "scripts/export_person_type.py"
      - ".github/workflows/export-model.yml"

permissions:
  contents: write

env:
  # Pinned: newer torch/numpy break coremltools' PyTorch converter.
  PIP_PINS: '"torch==2.5.1" "torchvision==0.20.1" "numpy==1.26.4" "coremltools==8.3.0"'

jobs:
  yoloe:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exporter
        run: |
          eval pip install $PIP_PINS
          pip install "ultralytics>=8.4,<8.5"
          eval pip install $PIP_PINS
      - name: Export YOLOE with vocabulary.json
        run: python scripts/export_yoloe.py
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd CoachCam/Resources/Models && zip -qry "$GITHUB_WORKSPACE/yoloe.mlpackage.zip" yoloe.mlpackage && cd -
          gh release delete model-yoloe --cleanup-tag --yes || true
          gh release create model-yoloe yoloe.mlpackage.zip --prerelease --target "${{ github.sha }}" \
            --title "YOLOE Core ML model" --notes "From scripts/export_yoloe.py. Not an app build."

  person-type:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exporter
        run: |
          eval pip install $PIP_PINS gdown
      - name: Export FairFace (gender + age only)
        run: python scripts/export_person_type.py
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd CoachCam/Resources/Models && zip -qry "$GITHUB_WORKSPACE/PersonTypeModel.mlpackage.zip" PersonTypeModel.mlpackage && cd -
          gh release delete model-person-type --cleanup-tag --yes || true
          gh release create model-person-type PersonTypeModel.mlpackage.zip --prerelease --target "${{ github.sha }}" \
            --title "Person type Core ML model" --notes "From scripts/export_person_type.py (FairFace, CC BY 4.0, race removed). Not an app build."
